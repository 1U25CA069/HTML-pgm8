<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CSS Size and Color Demo</title>

<style>
body{
    font-family: Verdana, sans-serif;
    background-color: #fff8e1;
    margin: 30px;
}

h1{
    text-align: center;
    color: darkred;
}

.container{
    width: 450px;
    height: 220px;
    margin: 25px auto;
    padding: 15px;
    border: 2px solid brown;
    background-color: #ffe4b5;
}

p{
    font-size: 17px;
    color: #444;
    line-height: 1.5;
}

.note{
    background-color: orange;
    color: white;
    padding: 8px;
    text-align: center;
    font-weight: bold;
}
</style>

</head>
<body>

<h1>CSS Size and Color Demo</h1>

<div class="container">
    <p>
        CSS allows us to control the width, height, margin,
        padding, and border of an element to create neat layouts.
    </p>

    <p class="note">
        Colors improve the appearance of web pages and make content easier to read.
    </p>
</div>

</body>
</html>
